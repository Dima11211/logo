<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логотип</title>
    <style>
        /* Убираем все отступы и центрируем картинку */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            /* Добавляем тень для красоты (опционально) */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        /* Если картинка не загрузится, покажем сообщение */
        .error-message {
            color: #666;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Основная картинка -->
        <img src="logo.png" alt="Логотип сайта">
        
        <!-- Сообщение, если картинка не загрузилась -->
        <div class="error-message" id="errorMessage" style="display: none;">
            ⚠️ Не удалось загрузить logo.png<br>
            <span style="font-size: 14px;">Убедитесь, что файл находится в той же папке, что и HTML-страница</span>
        </div>
    </div>

    <script>
        // Проверяем, загрузилась ли картинка
        const img = document.querySelector('img');
        const errorMsg = document.getElementById('errorMessage');

        // Если картинка не загрузилась, показываем сообщение
        img.addEventListener('error', function() {
            errorMsg.style.display = 'block';
            // Можно скрыть сломанную иконку
            img.style.display = 'none';
        });

        // Если загрузилась — скрываем сообщение (на всякий случай)
        img.addEventListener('load', function() {
            errorMsg.style.display = 'none';
            img.style.display = 'block';
        });
    </script>
</body>
</html>
